    Industry Experience:
      - company: Meta
        position: Research Advisor II
        location: Bellevue, WA, United States
        logo: meta.png
        start_date: 2026-05
        end_date: 2027-05
        summary: "Topic: LLM for Recommendation. Adviser: Dr. Cassie Dong."
        highlights:
          - Built a large-scale transformer-based model for effective and efficient ads ranking.

      - company: Nokia America
        position: Machine Learning Research Intern
        location: Sunnyvale, CA, United States
        logo: nokia.svg
        start_date: 2026-01
        end_date: 2026-05
        summary: "Topic: Generative Recommendation. Adviser: Dr. Liang Wu."
        highlights:
          - >
            Studied semantic ID (SID) based generative recommendation with large
            language models, focusing on reasoning-aware generation and
            efficient inference.
          - >
            Constructed explicit Chain-of-Thought (CoT) reasoning traces for each
            meta token in SID generation and trained a teacher model with a
            two-stage SFT-then-RL pipeline.
          - >
            Introduced auxiliary soft-thinking tokens for approximately
            1B-parameter student models and distilled the teacher's CoT into
            continuous latent embeddings.
          - >
            Deployed only the student model at inference time, achieving comparable
            ranking quality to explicit CoT-based generation with reduced latency
            and generation cost.

      - company: Snap Inc.
        position: Machine Learning Research Intern
        location: Bellevue, WA, United States
        logo: snap.png
        start_date: 2025-09
        end_date: 2025-12
        summary: "Topic: Agentic Recommendation Systems. Adviser: Dr. Clark Ju."
        highlights:
          - >
            Developed a personalized LLM-based agent for multi-channel item recall
            by extending Hugging Face's TRL framework.
          - >
            Designed and implemented a soft-token mechanism to structurally
            generate routing weights over recall channels.
          - >
            Modified the vLLM inference engine to support high-throughput
            soft-token decoding and agent-style online interaction.
          - >
            Adapted Group Relative Policy Optimization (GRPO) to optimize adaptive
            routing over multiple recall models.

      - company: Snap Inc.
        position: Research Assistant
        location: Bellevue, WA, United States
        logo: snap.png
        start_date: 2024-12
        end_date: 2025-05
        summary: "Topic: Cold-Start Item Recommendation. Adviser: Dr. Neil Shah."
        highlights:
          - >
            Developed an adaptive cold-start item recommendation system for rapidly
            emerging items with sparse or zero interaction histories.
          - >
            Proposed MI4Rec, a PLM-based cold-start recommender that infers item
            representations via meta-item embedding composition.
          - >
            Evaluated on Amazon-Beauty, Toys, Sports, and Yelp under cold-start,
            warm-start, and general settings, achieving up to 15.71% relative
            improvement in Recall.

      - company: Zerozero Robotics
        position: Machine Learning Engineer Intern
        location: Hangzhou, Zhejiang, China
        logo: zerozero.jpg
        start_date: 2022-03
        end_date: 2022-08
        summary: "Topic: Trajectory Planning. Adviser: Hao Zhang."
        highlights:
          - >
            Built an outdoor trajectory planning system for physical quadrotors and
            constructed realistic evaluation environments in Unity.
          - Reproduced an imitation learning framework and incorporated data aggregation to improve obstacle avoidance.
          - Achieved an 18.2% relative reduction in navigation failure rate in outdoor environments.

    Academic Experience:
      - company: University of Virginia
        position: Research Assistant
        location: Charlottesville, VA, United States
        logo: uva.png
        start_date: 2023-08
        end_date: present
        summary: "Topic: Retrieval-Augmented Generation (RAG). Adviser: Prof. Jundong Li."
        highlights:
          - >
            Proposed CoRAG, a hybrid RAG framework that dynamically selects between
            global textual retrieval and graph-based relational retrieval.
          - >
            Designed a Cooperative-Retrievers (CoR) mixture-of-retrievers module
            with hierarchical gating to adaptively fuse heterogeneous retrieval
            signals.
          - >
            Demonstrated strong performance on STaRK semi-structured KGQA
            benchmarks, achieving up to 11.4% relative Hit@1 improvement over
            prior RAG baselines.

      - company: University of Texas at Austin
        position: Research Assistant
        location: Austin, TX, United States
        logo: ut-austin.svg
        start_date: 2021-05
        end_date: 2021-09
        summary: "Topic: Indoor Navigation. Adviser: Dr. Wuyang Chen."
        highlights:
          - Developed an efficient and transferable robot navigation method for sim-to-real deployment.
          - Implemented a PPO-based navigation pipeline on Meta's Habitat platform.
          - >
            Proposed a contrastive learning component for visual representation
            learning with positive and negative sampling.

